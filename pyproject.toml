[project]
name = "zotero-mcp"
version = "0.1.0"
description = "Remote MCP server for full read/write access to a Zotero library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "zotero", "claude", "oauth2"]
dependencies = [
    "mcp",
    "pyzotero",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
